# Windows compile safety net on GitHub-hosted runners (the self-hosted RTX runner died
# with the Windows dev box; primary dev is Linux, see ci-linux.yml). Covers the two
# artifacts that can ONLY compile on Windows: shim.vcxproj (Media Foundation capture)
# and the WinUI 3 App. STUB shim config only — no Maxine SDK / NGC / GPU on hosted
# runners, so the Windows COS_HAS_MAXINE paths and the export-verify gate stay
# unverified until a Windows box returns (they move back with it).
name: ci

on:
  pull_request:

# One run per ref; cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-compile:
    name: Windows compile (stub shim + WinUI App)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build native shim (stub config, x64 Release)
        shell: pwsh
        run: |
          msbuild native/shim/shim.vcxproj /p:Configuration=Release /p:Platform=x64 /warnaserror /nologo
          if ($LASTEXITCODE -ne 0) { throw "shim build failed ($LASTEXITCODE)" }
          $dll = "native/shim/x64/Release/CameraOnScreen.Shim.dll"
          if (-not (Test-Path $dll)) { throw "shim DLL missing: $dll" }
          # Stub sanity: hosted runners have no SDK env, so this MUST be the passthrough stub.
          $strings = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($dll))
          if ($strings -notmatch 'not built in') { throw "expected the stub build on a hosted runner" }

      - name: Build App (copies shim, warnings = errors)
        shell: pwsh
        run: |
          dotnet build src/CameraOnScreen.App/CameraOnScreen.App.csproj `
            -c Release -t:Rebuild /p:TreatWarningsAsErrors=true --nologo
          if ($LASTEXITCODE -ne 0) { throw "App build failed ($LASTEXITCODE)" }

      - name: Test Core (xUnit, warnings = errors)
        shell: pwsh
        run: |
          dotnet test tests/CameraOnScreen.Core.Tests/CameraOnScreen.Core.Tests.csproj `
            -c Release /p:TreatWarningsAsErrors=true --nologo
          if ($LASTEXITCODE -ne 0) { throw "Core tests failed ($LASTEXITCODE)" }
