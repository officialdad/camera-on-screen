name: release

# A v* tag builds + verifies + attaches the Linux tarball on the self-hosted Linux RTX
# runner. The Windows installer job is manual-only (workflow_dispatch on the tag ref) BY
# DESIGN: its runner is a contributor's laptop (#48), online best-effort, so an automatic
# job would leave every tag-push run hanging for 24 h whenever the laptop is off. Both jobs
# share the concurrency group below, so a queued tag-push run (Linux runner offline) blocks
# the Windows dispatch until it is cancelled -- see docs/ci/self-hosted-runner.md. Heavy
# lifting lives in checked-in scripts (publish-linux.sh / build-installer.ps1 +
# verify-bundle.ps1) so this workflow stays a thin orchestrator.
#
# The tags are cut by .github/workflows/release-please.yml, which also creates the GitHub
# release as a DRAFT with a conventional-commit changelog. Neither job below creates a
# release any more -- they attach their OS asset to that draft and the last one to arrive
# publishes it, so a release goes live only once the Linux tarball AND the Windows
# installer are on it. Both jobs therefore share one body-header rule (the NVIDIA Maxine
# licence attribution) and one publish gate.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Never cancel a release mid-publish (unlike ci.yml, which cancels superseded runs).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # create the GitHub release + upload the installer asset

jobs:
  release-linux:
    name: Linux tarball + publish release
    runs-on: [self-hosted, linux, rtx]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # publish-linux.sh names the tarball from `git describe --tags`

      - name: Tool paths (user-local cmake + dotnet + gh — see runbook)
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"   # gh (v0.8.0 lesson: release step died on gh-not-found)
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Publish self-contained app + pruned maxine/ bundle + tarball
        run: |
          test -n "$COS_VFX_SDK_DIR" && test -n "$COS_AR_SDK_DIR"
          rm -f dist/*.tar.zst   # runner workspace persists; stale artifacts must not survive
          scripts/publish-linux.sh --tar

      - name: Runtime verify gate (bundled maxine/ tier, COS_* unset, GPU-only)
        run: |
          g++ -std=c++17 -DPROBE_ONLY -o dist/probe_gate \
              native/shim/smoke/effects_drive_linux.cpp \
              -L dist/linux -lCameraOnScreen.Shim -Wl,-rpath,$PWD/dist/linux
          env -u COS_VFX_RUNTIME_DIR -u COS_AR_RUNTIME_DIR -u COS_FRUC_RUNTIME_DIR \
              -u COS_VFX_SDK_DIR -u COS_AR_SDK_DIR -u COS_FRUC_SDK_DIR dist/probe_gate

      - name: Attach tarball to the draft release, publish once both OS files are present
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          PKG=$(ls dist/CameraOnScreen-*-linux-x64.tar.zst)

          # release-please creates the tag ref just before its draft release, and by the time
          # this step runs (after a full tarball build) the draft is normally already there.
          # The wait only covers that tiny gap, so keep it short.
          for _ in $(seq 1 12); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 10
          done

          # A hand-pushed tag has no release-please run behind it; create the draft the same
          # way release-please would (generated conventional-commit notes) so both paths
          # converge below. release-please creates the tag ref BEFORE its release, so losing
          # this race to it is normal -- a release that now exists is success either way.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Camera on Screen ${TAG#v}" \
              --verify-tag --generate-notes --draft \
              || gh release view "$TAG" >/dev/null
          fi

          gh release upload "$TAG" "$PKG" --clobber

          # Keep the NVIDIA Maxine attribution at the top of the notes; release-please's
          # changelog body stays underneath. Idempotent, so the Windows job applies the same
          # header in whichever order the two runners happen to finish.
          BODY=$(gh release view "$TAG" --json body --jq .body)
          if ! printf '%s' "$BODY" | grep -qF 'NVIDIA Maxine runtime'; then
            { cat .github/release-notes-header.md; printf '\n%s\n' "$BODY"; } > "$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi

          # Publish only when BOTH OS files are attached. install.sh resolves
          # /releases/latest (drafts excluded), so publishing a half-populated release is
          # exactly how Linux users end up pointed at a release carrying no tarball.
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          if printf '%s\n' "$ASSETS" | grep -qE 'linux-x64\.tar\.zst$' \
             && printf '%s\n' "$ASSETS" | grep -qE 'Setup-.*-x64\.exe$'; then
            gh release edit "$TAG" --draft=false
            echo "published $TAG (both OS files attached)"
          else
            echo "$TAG stays a draft; waiting for the OS file that is not attached yet"
            printf '%s\n' "$ASSETS"
          fi

  release-windows:
    name: Build installer + publish release (manual dispatch — #48)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, rtx]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner host has an x86 .NET (no SDK) at "C:\Program Files (x86)\dotnet"
      # that can shadow the x64 SDK on PATH -> `dotnet build` (inside build-installer.ps1)
      # fails "No .NET SDKs were found". Prepend the x64 install for all later steps.
      - name: Prefer x64 .NET on PATH
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\dotnet\dotnet.exe") {
            "C:\Program Files\dotnet" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      # Self-hosted runner runs as NETWORK SERVICE, but _work is owned by Administrators,
      # so git's dubious-ownership guard blocks `gh release create --verify-tag` (which
      # shells out to git). Trust the workspace under THIS account's gitconfig — an
      # interactive-user `git config --global` does not reach NETWORK SERVICE.
      - name: Trust workspace for git (NETWORK SERVICE account)
        shell: pwsh
        run: git config --global --add safe.directory '*'

      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([-.+].*)?$') {
            throw "tag '$tag' is not a vMAJOR.MINOR.PATCH release tag"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "release version: $version"

      # The Maxine stage is version-pinned (VFX 1.2.0.0 + AR 1.1.1.0) and does NOT change between
      # app releases, so it is assembled ONCE out-of-band (scripts/assemble-maxine-stage.ps1, which
      # is the only step needing the NGC key) and kept on the runner at $env:COS_MAXINE_STAGE. The
      # release just prunes it -- no per-release NGC re-download.
      - name: Check Maxine stage is present
        shell: pwsh
        run: |
          if (-not $env:COS_MAXINE_STAGE -or -not (Test-Path $env:COS_MAXINE_STAGE)) {
            throw "COS_MAXINE_STAGE not set/found on the runner. Build it once: scripts/assemble-maxine-stage.ps1 (see docs/ci/self-hosted-runner.md)."
          }

      - name: Build installer (shim SDK config -> self-contained app -> export-verify -> bundle -> ISCC)
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -Version '${{ steps.ver.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { throw "build-installer failed ($LASTEXITCODE)" }

      - name: Runtime verify gate (both effects load from the bundled maxine\, COS_* unset)
        shell: pwsh
        run: |
          ./scripts/verify-bundle.ps1
          if ($LASTEXITCODE -ne 0) { throw "bundle verify failed ($LASTEXITCODE)" }

      - name: Locate installer artifact
        id: art
        shell: pwsh
        run: |
          $exe = "dist/CameraOnScreen-Setup-${{ steps.ver.outputs.version }}-x64.exe"
          if (-not (Test-Path $exe)) { throw "installer not found: $exe" }
          "path=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host ("installer: {0} ({1:N0} bytes)" -f $exe, (Get-Item $exe).Length)

      - name: Attach installer to the draft release, publish once both OS files are present
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same shape as release-linux: attach to the draft release-please created for this
          # tag, keep the Maxine licence header on the notes, and publish only once BOTH OS
          # files are attached -- whichever job finishes second is the one that publishes.
          $tag = '${{ github.ref_name }}'
          $exe = '${{ steps.art.outputs.path }}'

          # Wait briefly for the draft release-please created for this tag, then attach.
          foreach ($i in 1..30) {
            gh release view $tag 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 10
          }
          # A hand-pushed tag has no release-please run behind it; create the draft the same
          # way release-please would so both paths converge on the gate below. A create that
          # loses the race is fine as long as a release now exists.
          if (-not (gh release view $tag 2>$null | Out-Null; $LASTEXITCODE -eq 0)) {
            gh release create $tag --title "Camera on Screen ${{ steps.ver.outputs.version }}" --verify-tag --generate-notes --draft
            if ($LASTEXITCODE -ne 0) {
              gh release view $tag 2>$null | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "gh release create failed and no release exists" }
            }
          }

          gh release upload $tag $exe --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed ($LASTEXITCODE)" }

          # -join is load-bearing: a multi-line body comes back as string[], and "+" would
          # collapse it onto one line (PowerShell joins arrays with $OFS).
          $body = (gh release view $tag --json body --jq .body) -join "`n"
          if ($body -notmatch 'NVIDIA Maxine runtime') {
            $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
            $header = Get-Content -Raw -Path '.github/release-notes-header.md'
            Set-Content -Path $notes -Value (($header.TrimEnd() + "`n`n" + $body + "`n")) -NoNewline
            gh release edit $tag --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release edit (notes) failed ($LASTEXITCODE)" }
          }

          $assets = gh release view $tag --json assets --jq '.assets[].name'
          $hasLinux = $assets | Where-Object { $_ -match 'linux-x64\.tar\.zst$' }
          $hasWindows = $assets | Where-Object { $_ -match 'Setup-.*-x64\.exe$' }
          if ($hasLinux -and $hasWindows) {
            gh release edit $tag --draft=false
            if ($LASTEXITCODE -ne 0) { throw "gh release edit (publish) failed ($LASTEXITCODE)" }
            Write-Host "published $tag (both OS files attached)"
          } else {
            Write-Host "$tag stays a draft; waiting for the OS file that is not attached yet"
            $assets | ForEach-Object { Write-Host "  $_" }
          }
