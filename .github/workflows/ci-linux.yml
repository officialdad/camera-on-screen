# Hosted Linux CI (issue #27 Phase 2). Runs on GitHub's ubuntu runners — no GPU, no
# camera, no Maxine SDK needed: the shim builds with the passthrough effect stubs and
# v4l2_probe passes with zero cameras by design.
#
# The maxine-rtx job (Phase 5) runs on the self-hosted Linux RTX box: SDK-config shim
# build + deploy-the-right-shim check + Maxine capability probe (GPU-only — the full
# camera gate stays manual, the box's camera is in interactive use). SDK dirs come from
# the runner's .env (docs/ci/self-hosted-runner.md). Windows Maxine CI still needs a
# Windows RTX box (ci.yml stub job meanwhile).
name: CI (Linux)

on:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build shim (.so, stub effects, warnings-as-errors)
        run: |
          cmake -S native/shim -B native/shim/build
          cmake --build native/shim/build

      - name: Verify exports
        run: |
          nm -D --defined-only native/shim/build/libCameraOnScreen.Shim.so | grep -q cos_query_capabilities
          nm -D --defined-only native/shim/build/libCameraOnScreen.Shim.so | grep -q cos_get_frame

      - name: ABI smoke (v4l2_probe; zero cameras is a pass)
        run: ./native/shim/build/v4l2_probe

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Avalonia app (deploys the .so, warnings as errors)
        run: dotnet build src/CameraOnScreen.App.Avalonia/CameraOnScreen.App.Avalonia.csproj -c Release /p:TreatWarningsAsErrors=true --nologo

      - name: Core tests
        run: dotnet test tests/CameraOnScreen.Core.Tests/CameraOnScreen.Core.Tests.csproj -c Release /p:TreatWarningsAsErrors=true --nologo

  maxine-rtx:
    runs-on: [self-hosted, linux, rtx]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build shim (SDK config, warnings-as-errors)
        run: |
          test -n "$COS_VFX_SDK_DIR" && test -n "$COS_AR_SDK_DIR"
          cmake -S native/shim -B native/shim/build-ci
          cmake --build native/shim/build-ci

      - name: Deploy-the-right-shim check
        run: |
          nm -D native/shim/build-ci/libCameraOnScreen.Shim.so | grep -q GetOSInfo
          ! strings native/shim/build-ci/libCameraOnScreen.Shim.so | grep -q "not built in"

      - name: Maxine capability probe (RTX, GPU-only)
        run: |
          g++ -std=c++17 -DPROBE_ONLY -o native/shim/build-ci/probe_gate \
              native/shim/smoke/effects_drive_linux.cpp \
              -L native/shim/build-ci -lCameraOnScreen.Shim \
              -Wl,-rpath,$PWD/native/shim/build-ci
          COS_VFX_RUNTIME_DIR="$COS_VFX_SDK_DIR" COS_AR_RUNTIME_DIR="$COS_AR_SDK_DIR" \
              ./native/shim/build-ci/probe_gate
